name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject online backend URL
        env:
          ONLINE_API_URL: ${{ vars.ONLINE_API_URL }}
        run: |
          if [ -z "$ONLINE_API_URL" ]; then
            echo "::error::Repository variable ONLINE_API_URL is empty. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          mkdir -p _site
          cp index.html online-config.js _site/
          printf 'window.DC_ONLINE_API = "%s";\n' "$ONLINE_API_URL" > _site/online-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
